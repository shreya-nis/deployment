name: Deploy Web Application (CloudFormation + SSH)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  STACK_NAME: skincare-app-stack

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Frontend
        env:
          VITE_API_URL: /api
        run: |
          cd frontend
          npm ci
          npm run build

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CloudFormation Stack (Create or Update EC2)
        run: |
          aws cloudformation deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --template-file infra/ec2-instance.yaml \
            --parameter-overrides InstanceType=t2.micro \
            --no-fail-on-empty-changeset \
            --region ${{ env.AWS_REGION }}

      - name: Retrieve EC2 Public IP
        id: get-ip
        run: |
          IP=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='PublicIP'].OutputValue" \
            --output text)
          echo "EC2_IP=$IP" >> $GITHUB_OUTPUT
          echo "Server Public IP: $IP"

      - name: Retrieve SSH Key from SSM Parameter Store
        id: get-key
        run: |
          SSM_PATH=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='SSMKeyPath'].OutputValue" \
            --output text)
          aws ssm get-parameter \
            --name "$SSM_PATH" \
            --with-decryption \
            --region ${{ env.AWS_REGION }} \
            --query "Parameter.Value" \
            --output text > /tmp/server-key.pem
          chmod 600 /tmp/server-key.pem

      - name: Wait for SSH Availability
        run: |
          IP=${{ steps.get-ip.outputs.EC2_IP }}
          for i in $(seq 1 36); do
            if nc -zw5 "$IP" 22 2>/dev/null; then
              echo "SSH port 22 is open!"
              exit 0
            fi
            echo "Waiting for SSH on $IP... ($i/36)"
            sleep 10
          done
          exit 1

      - name: Deploy Code & Restart Services via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          EC2_IP: ${{ steps.get-ip.outputs.EC2_IP }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        with:
          host: ${{ steps.get-ip.outputs.EC2_IP }}
          username: ubuntu
          key_path: /tmp/server-key.pem
          script_stop: true
          envs: EC2_IP,MONGO_URI,JWT_SECRET,GITHUB_TOKEN,GITHUB_REPO
          script: |
            test -f /swapfile || (sudo fallocate -l 1G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile || true)
            sudo mkdir -p /var/www/app
            sudo chown -R ubuntu:ubuntu /var/www/app
            git config --global --add safe.directory /var/www/app
            test -d /var/www/app/.git && (cd /var/www/app && git remote set-url origin https://oauth2:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git && git fetch origin main && git reset --hard origin/main) || git clone https://oauth2:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git /var/www/app
            cd /var/www/app/backend && npm ci --omit=dev
            printf "PORT=5000\nNODE_ENV=production\nCLIENT_URL=http://${EC2_IP}\nMONGO_URI=${MONGO_URI}\nMONGODB_URI=${MONGO_URI}\nJWT_SECRET=${JWT_SECRET}\nJWT_EXPIRES_IN=1d\n" > /var/www/app/backend/.env
            cd /var/www/app/frontend && npm ci && npm run build
            pm2 delete all 2>/dev/null || true
            cd /var/www/app/backend && pm2 start ecosystem.config.cjs --update-env && pm2 save
            sudo cp /var/www/app/infra/nginx.conf /etc/nginx/sites-available/app
            sudo ln -sf /etc/nginx/sites-available/app /etc/nginx/sites-enabled/app
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t && sudo systemctl reload nginx

      - name: Print Live Web Application URL
        run: echo "🎉 Website is live at http://${{ steps.get-ip.outputs.EC2_IP }}"

      - name: Clean up temporary SSH key
        if: always()
        run: rm -f /tmp/server-key.pem
